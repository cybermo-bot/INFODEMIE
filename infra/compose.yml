# Isolated development stack; production is deliberately blocked by API startup.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pnsi
      POSTGRES_USER: pnsi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an ignored local development password}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnsi"]
      interval: 5s
      retries: 10
  api:
    build: {context: .., dockerfile: infra/api.Dockerfile}
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://pnsi:${POSTGRES_PASSWORD}@postgres:5432/pnsi
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  worker:
    build: {context: .., dockerfile: infra/api.Dockerfile}
    command: ["python", "workers/run.py"]
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://pnsi:${POSTGRES_PASSWORD}@postgres:5432/pnsi
    depends_on: {api: {condition: service_started}}
  web:
    build: {context: .., dockerfile: infra/web.Dockerfile}
    environment: {API_INTERNAL_URL: "http://api:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
